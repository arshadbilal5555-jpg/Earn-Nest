<script>
"use strict";

const API_BASE = "/api";

let isSignUp = false;
let isBusy = false;


/* -----------------------------
   BASIC HELPERS
----------------------------- */

function get(id) {
  return document.getElementById(id);
}


function showMessage(message, type) {

  const box = get("message");

  box.textContent = String(
    message || "Something went wrong."
  );

  box.className =
    type === "success"
      ? "success"
      : "error";

  box.style.display = "block";
}


function clearMessage() {

  const box = get("message");

  box.textContent = "";
  box.className = "";
  box.style.display = "none";
}


function setButton(text, disabled) {

  const button = get("submitBtn");

  button.textContent = text;
  button.disabled = disabled;
}


/* -----------------------------
   API REQUEST
----------------------------- */

async function apiRequest(payload) {

  const response = await fetch(API_BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(payload)
  });

  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch (error) {
    throw new Error(
      "Server returned an invalid response."
    );
  }

  console.log("EarnNest API:", response.status, data);

  if (!response.ok) {

    throw new Error(
      data.message ||
      data.error ||
      "Server request failed."
    );
  }

  return data;
}


/* -----------------------------
   LOGIN
----------------------------- */

async function loginUser() {

  if (isBusy) {
    return;
  }

  const email =
    get("email").value.trim().toLowerCase();

  const password =
    get("password").value;

  if (!email) {

    showMessage(
      "Please enter your email address.",
      "error"
    );

    get("email").focus();
    return;
  }

  if (!password) {

    showMessage(
      "Please enter your password.",
      "error"
    );

    get("password").focus();
    return;
  }

  isBusy = true;

  clearMessage();

  setButton(
    "Logging in...",
    true
  );

  try {

    const data = await apiRequest({

      action: "login",

      email: email,

      login: email,

      password: password

    });


    if (
      data.success !== true ||
      !data.token ||
      !data.user
    ) {

      throw new Error(
        data.message ||
        data.error ||
        "Unable to login."
      );
    }


    localStorage.setItem(
      "earnnest_token",
      String(data.token)
    );


    localStorage.setItem(
      "earnnest_user",
      JSON.stringify(data.user)
    );


    showMessage(
      "Login successful. Opening dashboard...",
      "success"
    );


    setButton(
      "Opening Dashboard...",
      true
    );


    setTimeout(function() {

      window.location.assign(
        "/dashboard.html"
      );

    }, 600);


  } catch (error) {

    console.error(
      "Login error:",
      error
    );

    showMessage(
      error.message ||
      "Unable to login. Please try again.",
      "error"
    );

    setButton(
      "Login",
      false
    );

    isBusy = false;
  }
}


/* -----------------------------
   REGISTER
----------------------------- */

async function registerUser() {

  if (isBusy) {
    return;
  }

  const name =
    get("name").value.trim();

  const username =
    get("username").value.trim();

  const phone =
    get("phone").value.trim();

  const email =
    get("email").value.trim().toLowerCase();

  const password =
    get("password").value;

  const confirmPassword =
    get("confirmPassword").value;

  const referralCode =
    get("referralCode").value.trim();


  if (!name) {

    showMessage(
      "Please enter your full name.",
      "error"
    );

    get("name").focus();
    return;
  }


  if (!username) {

    showMessage(
      "Please choose a username.",
      "error"
    );

    get("username").focus();
    return;
  }


  if (!phone) {

    showMessage(
      "Please enter your phone number.",
      "error"
    );

    get("phone").focus();
    return;
  }


  if (!email) {

    showMessage(
      "Please enter your email address.",
      "error"
    );

    get("email").focus();
    return;
  }


  if (!password) {

    showMessage(
      "Please create a password.",
      "error"
    );

    get("password").focus();
    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    get("password").focus();
    return;
  }


  if (password !== confirmPassword) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    get("confirmPassword").focus();
    return;
  }


  isBusy = true;

  clearMessage();

  setButton(
    "Creating Account...",
    true
  );


  try {

    const data = await apiRequest({

      action: "register",

      name: name,

      username: username,

      phone: phone,

      email: email,

      password: password,

      confirmPassword: confirmPassword,

      referralCode: referralCode

    });


    if (data.success !== true) {

      throw new Error(
        data.message ||
        data.error ||
        "Unable to create account."
      );
    }


    if (data.token && data.user) {

      localStorage.setItem(
        "earnnest_token",
        String(data.token)
      );

      localStorage.setItem(
        "earnnest_user",
        JSON.stringify(data.user)
      );


      showMessage(
        "Account created successfully. Opening dashboard...",
        "success"
      );


      setButton(
        "Opening Dashboard...",
        true
      );


      setTimeout(function() {

        window.location.assign(
          "/dashboard.html"
        );

      }, 700);


      return;
    }


    showMessage(
      "Account created successfully. Please login.",
      "success"
    );


    isSignUp = false;

    updateMode();

    get("password").value = "";
    get("confirmPassword").value = "";

    setButton(
      "Login",
      false
    );

    isBusy = false;


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );

    showMessage(
      error.message ||
      "Unable to create account. Please try again.",
      "error"
    );

    setButton(
      "Create Account",
      false
    );

    isBusy = false;
  }
}


/* -----------------------------
   LOGIN / REGISTER MODE
----------------------------- */

function updateMode() {

  document
    .querySelectorAll(".signup-only")
    .forEach(function(element) {

      element.style.display =
        isSignUp
          ? "block"
          : "none";

    });


  get("title").textContent =
    isSignUp
      ? "Create Your Account"
      : "Welcome Back";


  get("subtitle").textContent =
    isSignUp
      ? "Join EarnNest and start earning coins"
      : "Login to continue to your EarnNest account";


  get("submitBtn").textContent =
    isSignUp
      ? "Create Account"
      : "Login";


  get("toggleText").textContent =
    isSignUp
      ? "Already have an account?"
      : "Don't have an account?";


  get("toggleBtn").textContent =
    isSignUp
      ? "Login"
      : "Create Account";


  get("forgotBox").style.display =
    isSignUp
      ? "none"
      : "block";


  clearMessage();
}


function toggleMode() {

  if (isBusy) {
    return;
  }

  isSignUp = !isSignUp;

  get("password").value = "";
  get("confirmPassword").value = "";

  updateMode();
}


/* -----------------------------
   PASSWORD
----------------------------- */

function togglePassword(inputId, button) {

  const input = get(inputId);

  if (input.type === "password") {

    input.type = "text";
    button.textContent = "🙈";

  } else {

    input.type = "password";
    button.textContent = "👁";

  }
}


/* -----------------------------
   FORGOT PASSWORD
----------------------------- */

function forgotPassword() {

  showMessage(
    "Password reset is not connected yet. Please contact support.",
    "error"
  );
}


/* -----------------------------
   START PAGE
----------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log(
      "EarnNest login page loaded."
    );


    const form = get("authForm");


    /* FORM SUBMIT */

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        if (isSignUp) {

          registerUser();

        } else {

          loginUser();

        }

      }
    );


    /* CREATE ACCOUNT BUTTON */

    get("toggleBtn").addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        toggleMode();

      }
    );


    /* PASSWORD EYE */

    get("passwordEye").addEventListener(
      "click",
      function() {

        togglePassword(
          "password",
          get("passwordEye")
        );

      }
    );


    /* CONFIRM PASSWORD EYE */

    get("confirmEye").addEventListener(
      "click",
      function() {

        togglePassword(
          "confirmPassword",
          get("confirmEye")
        );

      }
    );


    /* FORGOT PASSWORD */

    get("forgotBtn").addEventListener(
      "click",
      function() {

        forgotPassword();

      }
    );


    /* ENTER KEY */

    [
      "email",
      "password",
      "name",
      "username",
      "phone",
      "confirmPassword",
      "referralCode"
    ].forEach(function(id) {

      get(id).addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            form.requestSubmit();

          }

        }
      );

    });

  }
);
