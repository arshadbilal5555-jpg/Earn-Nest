<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnNest - Login & Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; position: relative; background: #eef2f7; }

    /* Canvas Scene for Farmer, Wheat Field, Animals & Falling Dollars */
    #sceneCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Login Form Overlay Card */
    .login-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .brand-title { text-align: center; font-size: 26px; color: #1565c0; font-weight: bold; margin-bottom: 6px; }
    .brand-subtitle { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    .form-control:focus { border-color: #2563eb; }

    .btn-submit { width: 100%; background: #2563eb; color: #ffffff; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 8px; }
    .btn-submit:hover { background: #1d4ed8; }

    .toggle-link { text-align: center; margin-top: 16px; font-size: 14px; color: #64748b; }
    .toggle-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Background Farm Scene Canvas -->
  <canvas id="sceneCanvas"></canvas>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-title">🌱 EarnNest</div>
      <div class="brand-subtitle">Work Hard, Earn Rewards</div>

      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@earnnest.app" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Login</button>
      </form>

      <div class="toggle-link">
        <span id="toggleText">Don't have an account?</span> 
        <a href="#" onclick="toggleMode(event)" id="toggleBtn">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    let isSignUp = false;

    function toggleMode(e) {
      if(e) e.preventDefault();
      isSignUp = !isSignUp;
      document.getElementById('nameGroup').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isSignUp ? 'Register' : 'Login';
      document.getElementById('toggleText').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggleBtn').textContent = isSignUp ? 'Login' : 'Sign Up';
    }

    function handleAuth(e) {
      e.preventDefault();
      alert(isSignUp ? "Account Created! Redirecting..." : "Login Successful!");
      window.location.href = "/dashboard.html";
    }

    // ANIMATED FARM SCENE WITH FALLING DOLLARS, FARMER & ANIMALS
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Rain Dollars
    const dollars = Array.from({ length: 30 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 1 + Math.random() * 2,
      size: 18 + Math.random() * 10
    }));

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun
      ctx.fillStyle = '#FDB813';
      ctx.beginPath();
      ctx.arc(100, 100, 45, 0, Math.PI * 2);
      ctx.fill();

      // Field Ground / Ready Wheat Crop (Gandum Ki Fasal)
      const fieldY = canvas.height * 0.65;
      
      // Green/Golden Wheat Field
      ctx.fillStyle = '#DAA520'; // Golden Wheat color
      ctx.fillRect(0, fieldY, canvas.width, canvas.height - fieldY);

      // Wheat Grass details
      ctx.strokeStyle = '#B8860B';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.width; i += 15) {
        ctx.beginPath();
        ctx.moveTo(i, fieldY + 50);
        ctx.lineTo(i + 5, fieldY - 20);
        ctx.stroke();
      }

      // Animals (Cow / Sheep grazing grass)
      ctx.font = "38px Arial";
      ctx.fillText("🐄", canvas.width * 0.15, fieldY + 30);
      ctx.fillText("🐐", canvas.width * 0.25, fieldY + 40);

      // Farmer Working in Wheat Field (Kisan Kheth Mein)
      ctx.font = "42px Arial";
      ctx.fillText("👨‍🌾", canvas.width * 0.75, fieldY + 10);

      // Falling Dollars ($)
      ctx.font = "bold 24px Arial";
      ctx.fillStyle = "#15803d";
      dollars.forEach(d => {
        ctx.fillText("💵 $", d.x, d.y);
        d.y += d.speed;
        if (d.y > canvas.height) {
          d.y = -20;
          d.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(drawScene);
    }

    drawScene();
  </script>
</body>
</html>
