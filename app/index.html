<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>EarnNest - Earn. Grow. Reward.</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,Arial,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 15% 20%,rgba(37,99,235,.35),transparent 35%),
        radial-gradient(circle at 85% 80%,rgba(6,182,212,.25),transparent 35%),
        linear-gradient(135deg,#020617,#0f172a 55%,#172554);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .page{
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns:1fr 430px;
      gap:50px;
      align-items:center;
    }

    .brand{
      padding:20px;
    }

    .logo{
      width:72px;
      height:72px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#2563eb,#06b6d4);
      box-shadow:0 15px 45px rgba(37,99,235,.35);
      font-size:38px;
      margin-bottom:22px;
    }

    .brand h1{
      font-size:58px;
      margin:0 0 12px;
      letter-spacing:-2px;
    }

    .brand h1 span{
      color:#38bdf8;
    }

    .brand p{
      max-width:550px;
      color:#cbd5e1;
      font-size:19px;
      line-height:1.7;
    }

    .features{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:25px;
    }

    .feature{
      padding:10px 15px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      border-radius:30px;
      color:#dbeafe;
      font-size:14px;
    }

    .panel{
      background:rgba(255,255,255,.96);
      color:#0f172a;
      border-radius:26px;
      padding:30px;
      box-shadow:0 30px 80px rgba(0,0,0,.35);
    }

    .panel-head{
      text-align:center;
      margin-bottom:24px;
    }

    .panel-head h2{
      margin:0 0 7px;
      font-size:28px;
    }

    .panel-head p{
      margin:0;
      color:#64748b;
    }

    .form{display:none}
    .form.active{display:block}

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:14px 0 7px;
      color:#334155;
    }

    input{
      width:100%;
      padding:14px 15px;
      border:1px solid #dbe3ef;
      border-radius:12px;
      outline:none;
      font-size:15px;
      background:#f8fafc;
      transition:.2s;
    }

    input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.1);
      background:#fff;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px;
      margin-top:18px;
      font-size:16px;
      font-weight:700;
      color:white;
      cursor:pointer;
      background:linear-gradient(135deg,#2563eb,#0891b2);
      box-shadow:0 10px 25px rgba(37,99,235,.2);
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .links{
      text-align:center;
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .links button{
      border:0;
      background:none;
      color:#2563eb;
      cursor:pointer;
      font-weight:600;
    }

    .message{
      display:none;
      margin:15px 0;
      padding:12px;
      border-radius:10px;
      font-size:14px;
    }

    .message.show{display:block}
    .message.error{
      background:#fee2e2;
      color:#991b1b;
    }

    .message.success{
      background:#dcfce7;
      color:#166534;
    }

    .mini{
      text-align:center;
      margin-top:20px;
      color:#94a3b8;
      font-size:12px;
    }

    @media(max-width:850px){
      .page{
        grid-template-columns:1fr;
        max-width:520px;
      }

      .brand{
        text-align:center;
      }

      .brand h1{
        font-size:44px;
      }

      .brand p{
        margin-left:auto;
        margin-right:auto;
      }

      .features{
        justify-content:center;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <section class="brand">
    <div class="logo">🪺</div>

    <h1>Earn<span>Nest</span></h1>

    <p>
      Earn rewards, complete tasks, grow your balance and manage
      everything from one simple and modern platform.
    </p>

    <div class="features">
      <div class="feature">🎁 Daily Rewards</div>
      <div class="feature">💰 Earn Coins</div>
      <div class="feature">🤝 Referrals</div>
      <div class="feature">🔐 Secure Account</div>
    </div>
  </section>

  <section class="panel">

    <div class="panel-head">
      <h2 id="formTitle">Welcome Back</h2>
      <p id="formSubtitle">Login to your EarnNest account</p>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN -->

    <form id="loginForm" class="form active">

      <label>Email or Username</label>
      <input id="loginEmail" type="text" required autocomplete="username">

      <label>Password</label>
      <input id="loginPassword" type="password" required autocomplete="current-password">

      <button class="btn" type="submit">
        Login
      </button>

      <div class="links">
        <button type="button" onclick="showForm('forgot')">
          Forgot Password?
        </button>

        <button type="button" onclick="showForm('register')">
          Create Account
        </button>
      </div>

    </form>

    <!-- REGISTER -->

    <form id="registerForm" class="form">

      <label>Full Name</label>
      <input id="regName" type="text" required>

      <label>Username</label>
      <input id="regUsername" type="text" required>

      <label>Email</label>
      <input id="regEmail" type="email" required>

      <label>Phone Number</label>
      <input id="regPhone" type="tel" required>

      <label>Password</label>
      <input id="regPassword" type="password" required>

      <label>Confirm Password</label>
      <input id="regConfirm" type="password" required>

      <button class="btn" type="submit">
        Create Account
      </button>

      <div class="links">
        <button type="button" onclick="showForm('login')">
          Already have an account? Login
        </button>
      </div>

    </form>

    <!-- FORGOT -->

    <form id="forgotForm" class="form">

      <label>Email</label>
      <input id="forgotEmail" type="email" required>

      <button class="btn" type="submit">
        Send Reset Code
      </button>

      <div class="links">
        <button type="button" onclick="showForm('reset')">
          I already have a code
        </button>

        <button type="button" onclick="showForm('login')">
          Back to Login
        </button>
      </div>

    </form>

    <!-- RESET -->

    <form id="resetForm" class="form">

      <label>Email</label>
      <input id="resetEmail" type="email" required>

      <label>Verification Code</label>
      <input id="resetCode" type="text" maxlength="6" required>

      <label>New Password</label>
      <input id="newPassword" type="password" required>

      <label>Confirm Password</label>
      <input id="newConfirm" type="password" required>

      <button class="btn" type="submit">
        Reset Password
      </button>

      <div class="links">
        <button type="button" onclick="showForm('login')">
          Back to Login
        </button>
      </div>

    </form>

    <div class="mini">
      © 2026 EarnNest. All rights reserved.
    </div>

  </section>

</div>

<script>

const $ = id => document.getElementById(id);

function showMessage(text,type="error"){
  const box=$("message");
  box.textContent=text;
  box.className="message show "+type;
}

function clearMessage(){
  $("message").className="message";
}

function showForm(name){

  clearMessage();

  document.querySelectorAll(".form").forEach(x=>{
    x.classList.remove("active");
  });

  $(name+"Form").classList.add("active");

  const titles={
    login:["Welcome Back","Login to your EarnNest account"],
    register:["Create Account","Join EarnNest and start earning"],
    forgot:["Forgot Password","Receive a verification code"],
    reset:["Reset Password","Create your new password"]
  };

  $("formTitle").textContent=titles[name][0];
  $("formSubtitle").textContent=titles[name][1];
}

async function request(url,options={}){

  const response=await fetch(url,{
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });

  let data={};

  try{
    data=await response.json();
  }catch{}

  return {response,data};
}

/* LOGIN */

$("loginForm").addEventListener("submit",async e=>{

  e.preventDefault();
  clearMessage();

  const login=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  try{

    const {response,data}=await request("/api/login",{
      method:"POST",
      body:JSON.stringify({
        login,
        email:login,
        password
      })
    });

    if(!response.ok){
      showMessage(data.message||data.error||"Login failed.");
      return;
    }

    if(!data.user){
      showMessage("Login response is invalid.");
      return;
    }

    localStorage.setItem(
      "earnnest_user",
      JSON.stringify(data.user)
    );

    if(data.token){
      localStorage.setItem(
        "earnnest_token",
        data.token
      );
    }

    showMessage("Login successful. Opening your account...","success");

    /*
      IMPORTANT:
      Redirect is based on role returned by API.
    */

    setTimeout(()=>{

      if(data.user.role==="admin"){
        window.location.replace("/admin");
      }else{
        window.location.replace("/dashboard");
      }

    },300);

  }catch(error){

    console.error(error);
    showMessage("Unable to connect to EarnNest server.");

  }

});

/* REGISTER */

$("registerForm").addEventListener("submit",async e=>{

  e.preventDefault();
  clearMessage();

  const password=$("regPassword").value;
  const confirm=$("regConfirm").value;

  if(password!==confirm){
    showMessage("Passwords do not match.");
    return;
  }

  try{

    const {response,data}=await request("/api/register",{
      method:"POST",
      body:JSON.stringify({
        name:$("regName").value.trim(),
        username:$("regUsername").value.trim(),
        email:$("regEmail").value.trim(),
        phone:$("regPhone").value.trim(),
        password,
        confirmPassword:confirm
      })
    });

    if(!response.ok){
      showMessage(data.message||data.error||"Registration failed.");
      return;
    }

    showMessage(
      "Account created successfully. Please login.",
      "success"
    );

    $("loginEmail").value=$("regEmail").value.trim();

    setTimeout(()=>{
      showForm("login");
    },1000);

  }catch(error){

    console.error(error);
    showMessage("Unable to connect to server.");

  }

});

/* FORGOT */

$("forgotForm").addEventListener("submit",async e=>{

  e.preventDefault();
  clearMessage();

  const email=$("forgotEmail").value.trim();

  try{

    const {response,data}=await request("/api/forgot-password",{
      method:"POST",
      body:JSON.stringify({email})
    });

    if(!response.ok){
      showMessage(data.message||data.error||"Unable to send reset code.");
      return;
    }

    $("resetEmail").value=email;

    let message=data.message||"Reset code sent.";

    if(data.testingCode){
      message+=" Testing code: "+data.testingCode;
    }

    showMessage(message,"success");

    setTimeout(()=>{
      showForm("reset");
    },1000);

  }catch(error){

    console.error(error);
    showMessage("Unable to connect to server.");

  }

});

/* RESET */

$("resetForm").addEventListener("submit",async e=>{

  e.preventDefault();
  clearMessage();

  const password=$("newPassword").value;
  const confirm=$("newConfirm").value;

  if(password!==confirm){
    showMessage("Passwords do not match.");
    return;
  }

  try{

    const {response,data}=await request("/api/reset-password",{
      method:"POST",
      body:JSON.stringify({
        email:$("resetEmail").value.trim(),
        code:$("resetCode").value.trim(),
        newPassword:password,
        confirmPassword:confirm
      })
    });

    if(!response.ok){
      showMessage(data.message||data.error||"Password reset failed.");
      return;
    }

    showMessage(
      "Password reset successfully. Please login.",
      "success"
    );

    setTimeout(()=>{
      showForm("login");
    },1200);

  }catch(error){

    console.error(error);
    showMessage("Unable to connect to server.");

  }

});

</script>

</body>
</html>
