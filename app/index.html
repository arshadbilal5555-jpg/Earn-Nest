<!DOCTYPE html>
<html lang="en">
<head>

  <title>EarnNest — Login & Register</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:"Segoe UI",Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      overflow-x:hidden;
      position:relative;

      background:
        radial-gradient(circle at 10% 10%,rgba(34,197,94,.25),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(16,185,129,.20),transparent 30%),
        linear-gradient(135deg,#022c22,#064e3b,#052e16);
    }

    body::before{
      content:"";
      position:fixed;
      width:420px;
      height:420px;
      border-radius:50%;
      background:rgba(34,197,94,.08);
      top:-220px;
      left:-180px;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      width:500px;
      height:500px;
      border-radius:50%;
      background:rgba(16,185,129,.07);
      bottom:-280px;
      right:-200px;
      pointer-events:none;
    }

    #moneyCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }

    .page{
      width:100%;
      max-width:440px;
      position:relative;
      z-index:5;
    }

    .card{
      background:rgba(255,255,255,.97);
      border-radius:24px;
      padding:32px;
      box-shadow:
        0 30px 70px rgba(0,0,0,.32),
        0 8px 25px rgba(0,0,0,.16);

    .brand{

    }

    .logo-box{

      margin:0 auto 10px;
      border-radius:18px;
      background:linear-gradient(145deg,#22c55e,#15803d);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        0 10px 25px rgba(22,163,74,.35),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    .logo-e{

    #message{

      padding:11px 13px;
      margin-bottom:15px;
      border-radius:10px;
      font-size:13px;
      line-height:1.45;
      font-weight:600;
      word-break:break-word;
    }

    #message.success{
      display:block;
      color:#166534;
      background:#dcfce7;
      border:1px solid #86efac;
    }

    #message.error{
      display:block;
      color:#991b1b;
      background:#fee2e2;
      border:1px solid #fca5a5;
    }

    .group{
      margin-bottom:15px;

    .group label{
      display:block;

      font-size:12px;
      font-weight:750;

      letter-spacing:.35px;
    }

    .input{
      width:100%;
      height:48px;
      border:1.5px solid #d1d5db;
      border-radius:11px;
      padding:0 14px;
      background:#f8fafc;
      color:#0f172a;
      outline:none;
      font-size:14px;
      transition:.2s;
    }

    .input::placeholder{
      color:#94a3b8;
    }

    .input:focus{
      background:#fff;
      border-color:#16a34a;
      box-shadow:0 0 0 4px rgba(22,163,74,.10);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap .input{
      padding-right:48px;
    }

    .eye{

      height:32px;

      font-size:16px;
    }

    .eye:hover{
      background:#f1f5f9;
