const API_BASE = "/api";

let isSignUp = false;


/* =========================================================

========================================================= */

function showMessage(message, type){

  const box =
    document.getElementById("message");

  box.textContent =
    String(message || "Something went wrong.");

  box.className =
    type === "success"
      ? "success"
      : "error";

  box.style.display = "block";
}


function clearMessage(){

  const box =
    document.getElementById("message");

  box.textContent = "";

  box.className = "";

  box.style.display = "none";
}


/* =========================================================
   MODE
========================================================= */

function toggleMode(){

  isSignUp = !isSignUp;

  document
    .querySelectorAll(".signup-only")
    .forEach(function(el){

      el.style.display =
        isSignUp
          ? "block"
          : "none";

    });


  document.getElementById("title").textContent =
    isSignUp
      ? "Create Your Account"
      : "Welcome Back";


  document.getElementById("subtitle").textContent =
    isSignUp
      ? "Join EarnNest and start earning coins"
      : "Login to continue to your EarnNest account";


  document.getElementById("submitBtn").textContent =
    isSignUp
      ? "Create Account"
      : "Login";


  document.getElementById("toggleText").textContent =
    isSignUp
      ? "Already have an account?"
      : "Don't have an account?";


  document.getElementById("toggleBtn").textContent =
    isSignUp
      ? "Login"
      : "Create Account";


  document.getElementById("forgotBox").style.display =
    isSignUp
      ? "none"
      : "block";


  document.getElementById("password").value = "";

  document.getElementById("confirmPassword").value = "";

  clearMessage();
}

function togglePassword(id, button){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";

    button.textContent = "🙈";

  }else{

    input.type = "password";

    button.textContent = "👁";

  }
}
