<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EarnNest — Login & Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(34,197,94,.25), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(16,185,129,.20), transparent 30%),
        linear-gradient(135deg, #022c22, #064e3b, #052e16);
    }

    .page {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 5;
    }

    .card {
      background: rgba(255,255,255,.98);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0,0,0,.32);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      color: white;
      font-size: 46px;
      font-weight: 900;
      background: linear-gradient(145deg,#22c55e,#15803d);
    }

    .brand-name {
      color: #166534;
      font-size: 27px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 4px;
      color: #64748b;
      font-size: 13px;
    }

    h1 {
      text-align: center;
      color: #0f172a;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .subtitle {
      margin-bottom: 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    #message {
      display: none;
      margin-bottom: 15px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 600;
      word-break: break-word;
    }

    #message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    #message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .field {
      margin-bottom: 15px;
    }

    .signup-only {
      display: none;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 11px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
    }

    input:focus {
      background: white;
      border-color: #16a34a;
      box-shadow: 0 0 0 4px rgba(22,163,74,.10);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .eye {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
    }

    .forgot {
      margin-top: -5px;
      margin-bottom: 6px;
      text-align: right;
    }

    .forgot button,
    .toggle button {
      border: 0;
      background: transparent;
      color: #15803d;
      cursor: pointer;
      font-weight: 700;
    }

    .forgot button {
      font-size: 12px;
    }

    .submit {
      width: 100%;
      height: 50px;
      margin-top: 9px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg,#22c55e,#15803d);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:hover {
      opacity: .92;
    }

    .submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    .toggle {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    .toggle button {
      margin-left: 4px;
      font-size: 13px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: rgba(255,255,255,.8);
      font-size: 11px;
    }

    .footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .logo {
        width: 64px;
        height: 64px;
        font-size: 41px;
      }

      .brand-name {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="brand">
        <div class="logo">E</div>
        <div class="brand-name">Earn Nest</div>
        <div class="tagline">Work Hard, Grow Your Balance</div>
      </div>

      <h1 id="title">Welcome Back</h1>

      <p class="subtitle" id="subtitle">
        Login to continue to your EarnNest account
      </p>

      <div id="message"></div>

      <form id="authForm" novalidate>

        <!-- NAME -->
        <div class="field signup-only">
          <label for="name">Full Name</label>

          <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
          >
        </div>

        <!-- USERNAME -->
        <div class="field signup-only">
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
          >
        </div>

        <!-- PHONE -->
        <div class="field signup-only">
          <label for="phone">Phone Number</label>

          <input
            id="phone"
            type="tel"
            placeholder="03XXXXXXXXX"
            autocomplete="tel"
          >
        </div>

        <!-- EMAIL -->
        <div class="field">
          <label for="email">Email Address</label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
          >
        </div>

        <!-- PASSWORD -->
        <div class="field">
          <label for="password">Password</label>

          <div class="password-box">

            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            >

            <button
              type="button"
              class="eye"
              id="passwordEye"
              aria-label="Show password"
            >👁</button>

          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="field signup-only">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-box">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm your password"
              autocomplete="new-password"
            >

            <button
              type="button"
              class="eye"
              id="confirmEye"
              aria-label="Show confirm password"
            >👁</button>

          </div>
        </div>

        <!-- REFERRAL -->
        <div class="field signup-only">
          <label for="referralCode">
            Referral Code (Optional)
          </label>

          <input
            id="referralCode"
            type="text"
            placeholder="Enter referral code"
          >
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot" id="forgotBox">

          <button
            type="button"
            id="forgotBtn"
          >
            Forgot Password?
          </button>

        </div>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="submit"
          id="submitBtn"
        >
          Login
        </button>

      </form>

      <!-- LOGIN / REGISTER TOGGLE -->
      <div class="toggle">

        <span id="toggleText">
          Don't have an account?
        </span>

        <button
          type="button"
          id="toggleBtn"
        >
          Create Account
        </button>

      </div>

    </section>

    <div class="footer">

      © 2026 EarnNest ·

      <a href="/privacy.html">
        Privacy
      </a>

      ·

      <a href="/terms.html">
        Terms
      </a>

    </div>

  </main>


  <script>
    "use strict";

    /*
      EarnNest Login/Register
      API endpoint
    */

    const API_BASE = "/api";

    let isSignUp = false;
    let isBusy = false;


    /* =========================
       GET ELEMENT
    ========================= */

    function get(id) {
      return document.getElementById(id);
    }


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(message, type) {

      const box = get("message");

      if (!box) {
        return;
      }

      box.textContent =
        String(message || "Something went wrong.");

      box.className =
        type === "success"
          ? "success"
          : "error";

      box.style.display = "block";
    }


    function clearMessage() {

      const box = get("message");

      if (!box) {
        return;
      }

      box.textContent = "";
      box.className = "";
      box.style.display = "none";
    }


    /* =========================
       BUTTON
    ========================= */

    function setButton(text, disabled) {

      const button = get("submitBtn");

      if (!button) {
        return;
      }

      button.textContent = text;
      button.disabled = disabled;
    }


    /* =========================
       API REQUEST
    ========================= */

    async function apiRequest(payload) {

      const response = await fetch(API_BASE, {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify(payload)
      });

      const responseText =
        await response.text();

      let data = {};

      try {

        data = responseText
          ? JSON.parse(responseText)
          : {};

      } catch (error) {

        throw new Error(
          "Server returned an invalid response."
        );
      }

      console.log(
        "EarnNest API:",
        response.status,
        data
      );

      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Server request failed."
        );
      }

      return data;
    }


    /* =========================
       LOGIN
    ========================= */

    async function loginUser() {

      if (isBusy) {
        return;
      }

      const email =
        get("email").value.trim().toLowerCase();

      const password =
        get("password").value;


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        get("email").focus();

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        get("password").focus();

        return;
      }


      isBusy = true;

      clearMessage();

      setButton(
        "Logging in...",
        true
      );


      try {

        const data =
          await apiRequest({

            action: "login",

            email: email,

            login: email,

            password: password

          });


        if (
          data.success !== true ||
          !data.token ||
          !data.user
        ) {

          throw new Error(
            data.message ||
            data.error ||
            "Unable to login."
          );
        }


        /*
          Save login information
        */

        localStorage.setItem(
          "earnnest_token",
          String(data.token)
        );


        localStorage.setItem(
          "earnnest_user",
          JSON.stringify(data.user)
        );


        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );


        setButton(
          "Opening Dashboard...",
          true
        );


        setTimeout(function() {

          window.location.href =
            "/dashboard.html";

        }, 700);


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to login. Please try again.",
          "error"
        );


        setButton(
          "Login",
          false
        );

        isBusy = false;
      }
    }


    /* =========================
       REGISTER
    ========================= */

    async function registerUser() {

      if (isBusy) {
        return;
      }


      const name =
        get("name").value.trim();

      const username =
        get("username").value.trim();

      const phone =
        get("phone").value.trim();

      const email =
        get("email").value.trim().toLowerCase();

      const password =
        get("password").value;

      const confirmPassword =
        get("confirmPassword").value;

      const referralCode =
        get("referralCode").value.trim();


      if (!name) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        get("name").focus();

        return;
      }


      if (!username) {

        showMessage(
          "Please choose a username.",
          "error"
        );

        get("username").focus();

        return;
      }


      if (!phone) {

        showMessage(
          "Please enter your phone number.",
          "error"
        );

        get("phone").focus();

        return;
      }


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        get("email").focus();

        return;
      }


      if (!password) {

        showMessage(
          "Please create a password.",
          "error"
        );

        get("password").focus();

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        get("password").focus();

        return;
      }


      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        get("confirmPassword").focus();

        return;
      }


      isBusy = true;

      clearMessage();

      setButton(
        "Creating Account...",
        true
      );


      try {

        const data =
          await apiRequest({

            action: "register",

            name: name,

            username: username,

            phone: phone,

            email: email,

            password: password,

            confirmPassword: confirmPassword,

            referralCode: referralCode

          });


        if (data.success !== true) {

          throw new Error(
            data.message ||
            data.error ||
            "Unable to create account."
          );
        }


        /*
          If backend returns token,
          automatically open dashboard.
        */

        if (data.token && data.user) {

          localStorage.setItem(
            "earnnest_token",
            String(data.token)
          );


          localStorage.setItem(
            "earnnest_user",
            JSON.stringify(data.user)
          );


          showMessage(
            "Account created successfully. Opening dashboard...",
            "success"
          );


          setButton(
            "Opening Dashboard...",
            true
          );


          setTimeout(function() {

            window.location.href =
              "/dashboard.html";

          }, 700);


          return;
        }


        /*
          Otherwise return to login.
        */

        showMessage(
          "Account created successfully. Please login.",
          "success"
        );


        isSignUp = false;

        updateMode();


        get("password").value = "";

        get("confirmPassword").value = "";


        setButton(
          "Login",
          false
        );


        isBusy = false;


      } catch (error) {

        console.error(
          "Registration error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to create account. Please try again.",
          "error"
        );


        setButton(
          "Create Account",
          false
        );


        isBusy = false;
      }
    }


    /* =========================
       LOGIN / REGISTER MODE
    ========================= */

    function updateMode() {

      document
        .querySelectorAll(".signup-only")
        .forEach(function(element) {

          element.style.display =
            isSignUp
              ? "block"
              : "none";

        });


      get("title").textContent =
        isSignUp
          ? "Create Your Account"
          : "Welcome Back";


      get("subtitle").textContent =
        isSignUp
          ? "Join EarnNest and start earning coins"
          : "Login to continue to your EarnNest account";


      get("submitBtn").textContent =
        isSignUp
          ? "Create Account"
          : "Login";


      get("toggleText").textContent =
        isSignUp
          ? "Already have an account?"
          : "Don't have an account?";


      get("toggleBtn").textContent =
        isSignUp
          ? "Login"
          : "Create Account";


      get("forgotBox").style.display =
        isSignUp
          ? "none"
          : "block";


      clearMessage();
    }


    function toggleMode() {

      if (isBusy) {
        return;
      }

      isSignUp = !isSignUp;


      get("password").value = "";

      get("confirmPassword").value = "";


      updateMode();
    }


    /* =========================
       PASSWORD SHOW/HIDE
    ========================= */

    function togglePassword(inputId, buttonId) {

      const input =
        get(inputId);

      const button =
        get(buttonId);


      if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

      } else {

        input.type = "password";

        button.textContent = "👁";

      }
    }


    /* =========================
       FORGOT PASSWORD
    ========================= */

    function forgotPassword() {

      showMessage(
        "Password reset is not connected yet. Please contact support.",
        "error"
      );
    }


    /* =========================
       PAGE START
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        console.log(
          "EarnNest login page loaded."
        );


        const form =
          get("authForm");


        /*
          Form submit
        */

        form.addEventListener(
          "submit",
          function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (isSignUp) {

              registerUser();

            } else {

              loginUser();

            }

          }
        );


        /*
          Create Account / Login toggle
        */

        get("toggleBtn").addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            event.stopPropagation();

            toggleMode();

          }
        );


        /*
          Password eye
        */

        get("passwordEye").addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            togglePassword(
              "password",
              "passwordEye"
            );

          }
        );


        /*
          Confirm password eye
        */

        get("confirmEye").addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            togglePassword(
              "confirmPassword",
              "confirmEye"
            );

          }
        );


        /*
          Forgot password
        */

        get("forgotBtn").addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            forgotPassword();

          }
        );


        /*
          Enter key
        */

        [
          "email",
          "password",
          "name",
          "username",
          "phone",
          "confirmPassword",
          "referralCode"
        ].forEach(function(id) {

          const field = get(id);

          if (!field) {
            return;
          }


          field.addEventListener(
            "keydown",
            function(event) {

              if (event.key === "Enter") {

                event.preventDefault();

                form.requestSubmit();

              }

            }
          );

        });


        /*
          Start in Login mode
        */

        updateMode();

      }
    );

  </script>

</body>
</html>
