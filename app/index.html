<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnNest - Login & Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }

    /* Background Image with Overlay */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      filter: brightness(0.85);
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.7) 100%);
      z-index: 2;
    }

    /* Falling Dollar Canvas Animation */
    #dollarCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Form Container */
    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: #475569;
      margin-top: 4px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .btn-submit:hover {
      background: #15803d;
    }

    .auth-toggle {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }

    .auth-toggle a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Background Khet & Kisan Picture -->
  <img src="Gemini_Generated_Image_778bs6778bs6778b.jfif" alt="Wheat Farm" class="bg-image">
  <div class="bg-overlay"></div>

  <!-- Falling Dollars Layer -->
  <canvas id="dollarCanvas"></canvas>

  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-title">🌱 EarnNest</div>
        <div class="brand-subtitle">Work Hard, Grow Balance</div>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@earnnest.app" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Login</button>
      </form>

      <div class="auth-toggle">
        <span id="toggleText">Don't have an account?</span>
        <a href="#" id="toggleBtn" onclick="toggleAuthMode(event)">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    let isSignUp = false;

    function toggleAuthMode(e) {
      if(e) e.preventDefault();
      isSignUp = !isSignUp;
      document.getElementById('nameGroup').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isSignUp ? 'Register' : 'Login';
      document.getElementById('toggleText').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggleBtn').textContent = isSignUp ? 'Login' : 'Sign Up';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      window.location.href = '/dashboard.html';
    }

    // Falling Dollar Animation
    const canvas = document.getElementById('dollarCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const dollars = Array.from({ length: 35 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 1.5 + Math.random() * 2.5,
      size: 20 + Math.random() * 12,
      opacity: 0.6 + Math.random() * 0.4
    }));

    function animateDollars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dollars.forEach(d => {
        ctx.font = `bold ${d.size}px Arial`;
        ctx.fillStyle = `rgba(34, 197, 94, ${d.opacity})`;
        ctx.fillText('💵 $', d.x, d.y);
        d.y += d.speed;
        if (d.y > canvas.height + 30) {
          d.y = -30;
          d.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(animateDollars);
    }
    animateDollars();
  </script>
</body>
</html>
