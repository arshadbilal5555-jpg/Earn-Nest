EarnNest dashboard.html — CPX Research connection changes

1) In the <script> section, find the end of loadWallet():

  async function loadWallet() {
    ...
  }

Immediately AFTER that function and BEFORE `const pageTitles = {`, insert:

  let cpxWallLoaded = false;

  async function loadCpxWall() {
    const frame = $("cpxFrame");
    const status = $("cpxStatus");
    if (!frame || !status) return;

    if (!token) {
      status.textContent = "Please log in again to use CPX Research.";
      status.className = "notice warning";
      frame.style.display = "none";
      return;
    }

    if (cpxWallLoaded && frame.src) return;

    status.textContent = "Connecting securely to CPX Research…";
    status.className = "notice";
    frame.style.display = "none";

    try {
      const data = await apiRequest("/cpx/wall");
      if (!data.url || typeof data.url !== "string") {
        throw new Error("CPX Research did not return a survey link.");
      }

      frame.onload = function () {
        status.textContent = "CPX Research is ready. Available surveys will appear below.";
        status.className = "notice success";
        frame.style.display = "block";
        cpxWallLoaded = true;
      };

      frame.src = data.url;
      frame.style.display = "block";
      status.textContent = "CPX Research is opening…";
    } catch (error) {
      cpxWallLoaded = false;
      frame.removeAttribute("src");
      frame.style.display = "none";
      status.textContent = error.message || "Could not connect to CPX Research. Please try again.";
      status.className = "notice warning";
    }
  }

2) In showPage(pageName), find:

    if (pageName === "wallet") loadWallet();

Change it to:

    if (pageName === "wallet") loadWallet();
    if (pageName === "cpx") loadCpxWall();

3) Save dashboard.html. Do not change the CPX iframe HTML section or remove any existing dashboard features.
